<div class="auth-wrap">
  <form class="auth-card" (submit)="submit($event)">
    <h1 class="auth-title">{{ 'app.title' | t }}</h1>
    <p class="auth-sub">{{ 'auth.login' | t }}</p>

    @if (error()) {
      <div class="auth-error">{{ error() }}</div>
    }

    <label class="auth-label">{{ 'auth.email' | t }}</label>
    <input
      class="auth-input"
      type="email"
      autocomplete="email"
      [value]="email()"
      (input)="email.set($any($event.target).value)"
      required
    />

    <label class="auth-label">{{ 'auth.password' | t }}</label>
    <input
      class="auth-input"
      type="password"
      autocomplete="current-password"
      [value]="password()"
      (input)="password.set($any($event.target).value)"
      required
    />

    <button class="auth-btn" type="submit" [disabled]="loading()">
      {{ loading() ? '…' : ('auth.login' | t) }}
    </button>

    <div class="auth-divider">
      <span>{{ 'auth.orContinueWith' | t }}</span>
    </div>

    <button
      class="auth-btn-google"
      type="button"
      [disabled]="loading()"
      (click)="loginWithGoogle()"
    >
      <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
        <path
          fill="#4285F4"
          d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.56 2.7-3.87 2.7-6.62z"
        />
        <path
          fill="#34A853"
          d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"
        />
        <path
          fill="#FBBC05"
          d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03z"
        />
        <path
          fill="#EA4335"
          d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"
        />
      </svg>
      {{ 'auth.loginWithGoogle' | t }}
    </button>

    <p class="auth-foot">
      {{ 'auth.noAccount' | t }}
      <a routerLink="/register" class="auth-link">{{ 'auth.register' | t }}</a>
    </p>
  </form>
</div>
