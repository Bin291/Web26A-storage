<div class="auth-wrap">
  <div class="auth-card">
    <h1 class="auth-title">{{ 'app.title' | t }}</h1>
    <p class="auth-sub">{{ 'auth.register' | t }}</p>

    <app-email-otp-form [mode]="'signup'" />

    <p class="auth-foot">
      {{ 'auth.haveAccount' | t }}
      <a routerLink="/login" class="auth-link">{{ 'auth.login' | t }}</a>
    </p>
  </div>
</div>
